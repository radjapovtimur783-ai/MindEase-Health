<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MindEase Health</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="navbar">
        <a href="/" class="logo">MindEase Health</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/register">Register</a>
        </div>
    </div>

    <div class="container">
        <div class="hero-box">
            <h1>User Login</h1>
            <p>Log in to access your MindEase Health dashboard</p>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="success-box">
                        {% for message in messages %}
                            <p>{{ message }}</p>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form class="login-form" method="POST" action="/login">
                <input type="email" name="email" placeholder="University email address" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" class="btn">Enter Dashboard</button>
            </form>

            <p>Don’t have an account yet?</p>
            <a href="/register" class="btn">Create Account</a>
        </div>
    </div>
</body>
</html>
